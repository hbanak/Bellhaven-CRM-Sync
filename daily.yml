name: Daily Bellhaven Sync

on:
  schedule:
    - cron: '0 9 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3-11
      - run: pip install -r requirements.txt
      - run: python main.py
